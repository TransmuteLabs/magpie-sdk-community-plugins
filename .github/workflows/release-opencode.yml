name: Release OpenCode for macOS

on:
  workflow_dispatch:
    inputs:
      plugin_commit:
        description: Reviewed plugin repository commit (full SHA on main)
        required: true
        type: string
      sdk_commit:
        description: Reviewed TransmuteLabs/magpie SDK commit (full SHA on devzeus)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-opencode
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.inventory.outputs.publish }}
      tag: ${{ steps.inventory.outputs.tag }}
    env:
      SDK_COMMIT: ${{ inputs.sdk_commit }}
    steps:
      - name: Require the reviewed source commits
        shell: bash
        env:
          PLUGIN_COMMIT: ${{ inputs.plugin_commit }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != TransmuteLabs/magpie-sdk-community-plugins ||
                "$GITHUB_REF" != refs/heads/main ||
                "$PLUGIN_COMMIT" != "$GITHUB_SHA" ||
                ! "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Select the reviewed main revision and supply both full commit SHAs."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check the published module versions
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" \
                '{schema:1, repository:$repo, complete:true, releases:[.[][] | {tag_name,draft,prerelease}]}' \
            > "$RUNNER_TEMP/opencode-publications.json"
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from release_build import module_tag, publication, read_json

          plugin = read_json("packages/opencode/docs/source-lock.json")["plugin"]
          version = plugin["version"]
          if plugin["id"] != "opencode" or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Expected a stable OpenCode module version")
          tag = module_tag("opencode", version)
          inventory = Path(os.environ["RUNNER_TEMP"]) / "opencode-publications.json"
          _, published = publication(inventory, "opencode", version)
          if not published and any(item["tag_name"] == tag for item in read_json(inventory)["releases"]):
              raise SystemExit("A draft already exists for this version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"version={version}", f"tag={tag}", f"publish={'false' if published else 'true'}",
                    sep="\n", file=output)
          if published:
              print(f"{tag} is already published. Skipping the build.")
          PY

      - uses: actions/checkout@v5
        if: steps.inventory.outputs.publish == 'true'
        with:
          repository: TransmuteLabs/magpie
          ref: ${{ inputs.sdk_commit }}
          path: sdk-source
          persist-credentials: false

      - name: Verify and seal the SDK checkout
        if: steps.inventory.outputs.publish == 'true'
        shell: bash
        run: |
          test "$(git -C sdk-source rev-parse HEAD)" = "$SDK_COMMIT"
          git -C sdk-source fetch --no-tags --filter=tree:0 origin \
            refs/heads/devzeus:refs/remotes/origin/devzeus
          git -C sdk-source merge-base --is-ancestor "$SDK_COMMIT" refs/remotes/origin/devzeus
          test -z "$(git -C sdk-source status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          if not hasattr(hashlib, "file_digest"):
              raise SystemExit("Release packaging requires Python 3.11 or newer")
          root = Path("sdk-source")
          paths = subprocess.check_output(["git", "-C", str(root), "ls-files", "-z"]).split(b"\0")
          files = {}
          for raw in filter(None, paths):
              name = os.fsdecode(raw)
              path = root / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Unsupported SDK file: {name}")
              with path.open("rb") as source:
                  sha = hashlib.file_digest(source, "sha256").hexdigest()
              files[name] = {"sha256": sha, "mode": path.stat().st_mode & 0o777}
          identity = hashlib.sha256(json.dumps(files, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          index = {"commit": os.environ["SDK_COMMIT"], "identity": identity, "files": files}
          (Path(os.environ["RUNNER_TEMP"]) / "opencode-sdk.json").write_text(json.dumps(index) + "\n")
          PY

      - uses: actions/setup-go@v6
        if: steps.inventory.outputs.publish == 'true'
        with:
          go-version-file: sdk-source/go.mod
          cache-dependency-path: |
            packages/opencode/src/go.sum
            sdk-source/go.sum

      - uses: oven-sh/setup-bun@v2
        if: steps.inventory.outputs.publish == 'true'
        with:
          bun-version: 1.4.2

      - name: Prepare the selected package's build dependencies
        if: steps.inventory.outputs.publish == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(uname -m)" = arm64
          npm install --global --prefix "$RUNNER_TEMP/sdk-tools" --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "$RUNNER_TEMP/sdk-tools/bin" >> "$GITHUB_PATH"
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from _workspace import build_environment

          package = Path("packages/opencode")
          with build_environment(package, Path("sdk-source")) as (env, _):
              env.update(GOPROXY="https://proxy.golang.org", GOSUMDB="sum.golang.org")
              subprocess.run(["go", "list", "-deps", "-test", "./..."], cwd=package / "src",
                             stdout=subprocess.DEVNULL, env=env, check=True)
          PY

      - name: Check and package OpenCode
        if: steps.inventory.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.inventory.outputs.version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check.py opencode --sdk sdk-source --race
          candidate="$RUNNER_TEMP/opencode-candidate"
          python3 scripts/release_build.py opencode --version "$VERSION" --sdk sdk-source \
            --sdk-source-manifest "$RUNNER_TEMP/opencode-sdk.json" \
            --published "$RUNNER_TEMP/opencode-publications.json" --output "$candidate"
          lipo -verify_arch arm64 "$candidate/built/opencode/lib/opencode.dylib"
          python3 scripts/release.py opencode --input "$candidate/built" \
            --output "$RUNNER_TEMP/opencode-release" --platform darwin_arm64

      - uses: actions/upload-artifact@v6
        if: steps.inventory.outputs.publish == 'true'
        with:
          name: opencode-darwin-arm64
          path: ${{ runner.temp }}/opencode-release/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: opencode-darwin-arm64
          path: release

      - name: Publish the verified assets for this source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: |
          [[ "$TAG" =~ ^opencode-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset=magpie-plugin_opencode__darwin_arm64.zip
          checksum=$(cat release/checksums.txt)
          digest=${checksum%% *}
          [[ "$digest" =~ ^[0-9a-f]{64}$ && "$checksum" == "$digest  $asset" ]]
          (cd release && sha256sum --check --strict checksums.txt)

          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          jq -e --arg tag "$TAG" 'all(.[][]; .tag_name != $tag)' <<< "$releases" > /dev/null

          ref="refs/tags/$TAG"
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG")
          if jq -e --arg ref "$ref" 'all(.[]; .ref != $ref)' <<< "$refs" > /dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' > /dev/null
          gh release create "$TAG" "release/$asset" release/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --latest=false \
            --notes "OpenCode for macOS arm64 from $GITHUB_SHA. Magpie SDK: TransmuteLabs/magpie@$SDK_COMMIT."
