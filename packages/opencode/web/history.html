<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>История OpenCode</title>
</head>
<body>
  <main id="history-panel">
    <button id="history-refresh" type="button">Проверить доступ</button>
    <div id="history-roots" aria-label="Хранилища истории"></div>
    <button id="history-access" type="button" disabled>Запросить доступ</button>
    <button id="history-release" type="button" disabled>Отозвать делегирование</button>
    <button id="history-list" type="button" disabled>Загрузить сессии</button>
    <p id="history-status" role="status" aria-live="polite"></p>
    <div id="history-sessions" aria-label="Сессии"></div>
    <button id="history-more" type="button" hidden>Следующая страница</button>
    <article id="history-transcript" aria-label="Разговор"></article>
    <div id="history-media" aria-label="Вложения"></div>
  </main>
  <script src="_magpie/bridge.js"></script>
  <script src="./app.browser.js"></script>
</body>
</html>
