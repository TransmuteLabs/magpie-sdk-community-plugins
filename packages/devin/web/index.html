<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devin sign-in</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Devin</h1>
    <p>Authorize Devin in your browser, then return here to complete sign-in.</p>
    <button id="signin" type="button">Sign in</button>
    <p id="status" role="status" aria-live="polite">Start browser sign-in to begin.</p>
    <div id="auth-address" hidden>
      <label for="auth-url">Open this address in your browser</label>
      <input id="auth-url" type="text" readonly>
      <button id="auth-select" type="button">Select address to copy</button>
    </div>
    <div class="actions">
      <button id="finish" type="button" disabled>Check sign-in</button>
      <button id="cancel" type="button" disabled>Cancel sign-in</button>
    </div>
  </main>
  <script src="_magpie/bridge.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
